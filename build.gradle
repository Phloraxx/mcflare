plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

version = providers.gradleProperty('release_version').getOrElse("${mod_version}-dev")
group = project.maven_group

// Keep Gradle-produced archive contents deterministic. Loom may inject nested JAR
// filesystem timestamps afterward; the release workflow normalizes the final JAR.
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def adapterJavaVersion = Integer.parseInt(project.adapter_java_version.toString())
def useMojangMappings = project.use_mojang_mappings.toString().toBoolean()

apply plugin: (useMojangMappings ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')

base {
    archivesName = "${project.archives_base_name}-${project.artifact_label}"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
    include project(':core')
    implementation project(':gateway')
    include project(':gateway')

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (useMojangMappings) {
        mappings loom.officialMojangMappings()
    }
    if (useMojangMappings) {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    inputs.property 'loader_version', project.loader_version
    inputs.property 'adapter_java_version', project.adapter_java_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: project.minecraft_version,
                minecraft_dependency: project.minecraft_dependency,
                loader_version: project.loader_version,
                adapter_java_version: project.adapter_java_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = adapterJavaVersion
}

java {
    sourceCompatibility = JavaVersion.toVersion(adapterJavaVersion)
    targetCompatibility = JavaVersion.toVersion(adapterJavaVersion)
}

jar {
    inputs.property 'archivesName', project.base.archivesName
    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    from('NOTICE.md') {
        rename { "NOTICE_${inputs.properties.archivesName}.md" }
    }
}
