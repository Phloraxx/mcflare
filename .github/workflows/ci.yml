name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Markdown links and documentation assets
        run: python3 scripts/check_docs.py
      - name: Verify release archive normalizer
        run: python3 scripts/normalize_zip.py --self-test

  fabric:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric 1.21.11
            java: '21'
            minecraft: '1.21.11'
            minecraft_dependency: '~1.21.11'
            loader: '0.18.2'
            loom: '1.14-SNAPSHOT'
            mappings: 'true'
            artifact: '1.21.11'
          - name: Fabric 26.1-26.2 release
            java: '25'
            minecraft: '26.1'
            minecraft_dependency: '>=26.1 <26.3'
            loader: '0.18.4'
            loom: '1.15-SNAPSHOT'
            mappings: 'false'
            artifact: '26.1-26.2'
          - name: Fabric 26.2 head compatibility
            java: '25'
            minecraft: '26.2'
            minecraft_dependency: '~26.2'
            loader: '0.19.3'
            loom: '1.17-SNAPSHOT'
            mappings: 'false'
            artifact: '26.2-compat'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and test Fabric
        run: >-
          ./gradlew --no-daemon
          :core:clean :gateway:clean :clean
          :core:build :gateway:build :build
          -Pminecraft_version="${{ matrix.minecraft }}"
          -Pminecraft_dependency="${{ matrix.minecraft_dependency }}"
          -Ploader_version="${{ matrix.loader }}"
          -Ploom_version="${{ matrix.loom }}"
          -Padapter_java_version="${{ matrix.java }}"
          -Puse_mojang_mappings="${{ matrix.mappings }}"
          -Partifact_label="${{ matrix.artifact }}"

  neoforge:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.11
            java: '21'
            moddev: '2.0.124'
            neo: '21.11.6-beta'
            neo_range: '[21.11.6-beta,)'
            minecraft_range: '[1.21.11]'
            artifact: '1.21.11'
            parchment: 'true'
            fabric_minecraft: '1.21.11'
            fabric_dependency: '~1.21.11'
            fabric_loader: '0.18.2'
            fabric_loom: '1.14-SNAPSHOT'
            fabric_mappings: 'true'
          - name: NeoForge 26.1-26.2 release
            java: '25'
            moddev: '2.0.141'
            neo: '26.1.0.1-beta'
            neo_range: '[26.1.0.1-beta,)'
            minecraft_range: '[26.1,26.3)'
            artifact: '26.1-26.2'
            parchment: 'false'
            fabric_minecraft: '26.1'
            fabric_dependency: '>=26.1 <26.3'
            fabric_loader: '0.18.4'
            fabric_loom: '1.15-SNAPSHOT'
            fabric_mappings: 'false'
          - name: NeoForge 26.2 head compatibility
            java: '25'
            moddev: '2.0.141'
            neo: '26.2.0.37-beta'
            neo_range: '[26.2.0.37-beta,)'
            minecraft_range: '[26.2,26.3)'
            artifact: '26.2-compat'
            parchment: 'false'
            fabric_minecraft: '26.2'
            fabric_dependency: '~26.2'
            fabric_loader: '0.19.3'
            fabric_loom: '1.17-SNAPSHOT'
            fabric_mappings: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and test NeoForge
        run: >-
          ./gradlew --no-daemon
          :core:clean :gateway:clean :neoforge:clean
          :core:build :gateway:build :neoforge:build
          -Pneoforge_moddev_version="${{ matrix.moddev }}"
          -Pneo_version="${{ matrix.neo }}"
          -Pneo_version_range="${{ matrix.neo_range }}"
          -Pneoforge_minecraft_version_range="${{ matrix.minecraft_range }}"
          -Pneoforge_java_version="${{ matrix.java }}"
          -Pneoforge_artifact_label="${{ matrix.artifact }}"
          -Pneoforge_use_parchment="${{ matrix.parchment }}"
          -Pminecraft_version="${{ matrix.fabric_minecraft }}"
          -Pminecraft_dependency="${{ matrix.fabric_dependency }}"
          -Ploader_version="${{ matrix.fabric_loader }}"
          -Ploom_version="${{ matrix.fabric_loom }}"
          -Padapter_java_version="${{ matrix.java }}"
          -Puse_mojang_mappings="${{ matrix.fabric_mappings }}"
          -Partifact_label="${{ matrix.artifact }}"

  paper:
    name: Paper / Purpur plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and test Paper plugin
        run: ./gradlew --no-daemon :core:build :gateway:build :paper:clean :paper:build
