plugins {
    id 'application'
}

group = 'io.mcflare'
version = '0.1.0-dev'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

application {
    mainClass = 'io.mcflare.gateway.McflareGateway'
}


dependencies {
    implementation project(':core')
}
